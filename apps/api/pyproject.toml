[project]
name = "fitsense-api"
version = "0.1.0"
description = "Universal Fit Intelligence API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.10.0",
    "httpx>=0.28.0",
    "supabase>=2.10.0",
    "slowapi>=0.1.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.vercel]
entrypoint = "app.main:app"
