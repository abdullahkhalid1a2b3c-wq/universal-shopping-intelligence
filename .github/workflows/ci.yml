name: FitSense Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_SERVICE_KEY: "test-service-key"
          SUPABASE_JWT_SECRET: "ci-test-jwt-secret-minimum-32-chars-long"
          ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          pytest -v

  web-checks:
    name: Frontend Web Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Prepare Nuxt Types
        working-directory: apps/web
        run: pnpm nuxi prepare

      - name: TypeScript Type-Check
        working-directory: apps/web
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run Web Unit Tests
        run: pnpm test:web

  extension-checks:
    name: Chrome Extension Build, Tests & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Build Chrome Extension
        run: pnpm build:extension

      - name: Run Extension Unit Tests
        run: pnpm test:extension

      - name: Run Bundle Secret Leak Audit
        run: pnpm scan:secrets

